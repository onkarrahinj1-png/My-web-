<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Suppliers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Study Suppliers</h1>
        <p>Share and Access Study Materials Easily</p>
    </header>

    <main class="container">
        <!-- Upload Form -->
        <section class="upload-section">
            <h2>Upload Material</h2>
            <form id="uploadForm">
                <input type="text" id="title" placeholder="Material Title" required>
                <input type="text" id="subject" placeholder="Subject" required>
                <input type="url" id="link" placeholder="Google Drive Link" required>
                <button type="submit">Upload</button>
            </form>
        </section>

        <!-- Materials List -->
        <section class="list-section">
            <h2>Available Materials</h2>
            <div id="materialsList">
                <p>Loading materials...</p>
            </div>
        </section>
    </main>

    <!-- Firebase support with type="module" -->
    <script type="module" src="script.js"></script>
</body>
</html>
